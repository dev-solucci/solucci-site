<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 735" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">Jornada de recarga do Conlife</title><desc id="flow-desc">Selecionar plano e pagamento. Pix gera QR Code, verifica pagamento, compra dados e emite comprovante. Expiração gera aviso e erro de compra gera estorno. Com conta digital, digitar PIN, transferir saldo para a tesouraria, comprar dados e emitir comprovante. Erro devolve o saldo. Sem conta digital, consultar aviso e mapa de pontos de recarga.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><path class="flow-edge" data-route="common" d="M155 142H200" marker-end="url(#tip)"/><path class="flow-edge" data-route="common" d="M350 142H395" marker-end="url(#tip)"/><path class="flow-edge" data-route="common" d="M545 142H590" marker-end="url(#tip)"/><path class="flow-edge" data-route="pix" d="M690 142H760" marker-end="url(#tip)"/><path class="flow-edge" data-route="pix" d="M910 142H930" marker-end="url(#tip)"/><path class="flow-edge" data-route="pix" d="M1080 142H1120" marker-end="url(#tip)"/><path class="flow-edge" data-route="pix" d="M1005 67V52H1120" marker-end="url(#tip)"/><path class="flow-edge" data-route="pix" d="M1280 142H1340" marker-end="url(#tip)"/><path class="flow-edge" data-route="pix" d="M1200 174V240" marker-end="url(#tip)"/><path class="flow-edge" data-route="saldo local" d="M640 192V355" marker-end="url(#tip)"/><path class="flow-edge" data-route="saldo" d="M705 420H760" marker-end="url(#tip)"/><path class="flow-edge" data-route="saldo" d="M910 420H955" marker-end="url(#tip)"/><path class="flow-edge" data-route="saldo" d="M1105 420H1160" marker-end="url(#tip)"/><path class="flow-edge" data-route="saldo" d="M1320 420H1380" marker-end="url(#tip)"/><path class="flow-edge" data-route="saldo" d="M1240 452V535" marker-end="url(#tip)"/><path class="flow-edge" data-route="local" d="M640 485V657H760" marker-end="url(#tip)"/><path class="flow-edge" data-route="local" d="M910 657H955" marker-end="url(#tip)"/><text class="flow-label" data-route="pix" x="717" y="130">Sim</text><text class="flow-label" data-route="pix" x="1080" y="130">Sim</text><text class="flow-label" data-route="pix" x="1055" y="40">Não</text><text class="flow-label" data-route="pix" x="1215" y="218">Erro</text><text class="flow-label" data-route="saldo local" x="655" y="285">Não</text><text class="flow-label" data-route="saldo" x="718" y="407">Sim</text><text class="flow-label" data-route="saldo" x="1255" y="505">Erro</text><text class="flow-label" data-route="local" x="655" y="570">Não</text><g class="flow-node" data-node="inicio" data-route="common"><rect class="node-shape" x="35" y="110" width="120" height="64" rx="32"/><text x="95.0" y="148.0" text-anchor="middle">Recarga</text></g><g class="flow-node" data-node="plano" data-route="common"><rect class="node-shape" x="200" y="110" width="150" height="64" rx="7"/><text x="275.0" y="137.0" text-anchor="middle">Selecionar</text><text x="275.0" y="159.0" text-anchor="middle">plano</text></g><g class="flow-node" data-node="forma" data-route="common"><rect class="node-shape" x="395" y="110" width="150" height="64" rx="7"/><text x="470.0" y="137.0" text-anchor="middle">Forma de</text><text x="470.0" y="159.0" text-anchor="middle">pagamento</text></g><g class="flow-node" data-node="pix" data-route="common"><path class="node-shape decision" d="M640.0 92 690 142.0 640.0 192 590 142.0Z"/><text x="640.0" y="137.0" text-anchor="middle">Pagar</text><text x="640.0" y="159.0" text-anchor="middle">por Pix?</text></g><g class="flow-node" data-node="qr" data-route="pix"><rect class="node-shape" x="760" y="110" width="150" height="64" rx="7"/><text x="835.0" y="137.0" text-anchor="middle">Gerar</text><text x="835.0" y="159.0" text-anchor="middle">QR Code</text></g><g class="flow-node" data-node="pago" data-route="pix"><path class="node-shape decision" d="M1005.0 67 1080 142.0 1005.0 217 930 142.0Z"/><text x="1005.0" y="137.0" text-anchor="middle">Pagamento</text><text x="1005.0" y="159.0" text-anchor="middle">realizado?</text></g><g class="flow-node" data-node="comprapix" data-route="pix"><rect class="node-shape" x="1120" y="110" width="160" height="64" rx="7"/><text x="1200.0" y="148.0" text-anchor="middle">Comprar dados</text></g><g class="flow-node" data-node="recibopix" data-route="pix"><rect class="node-shape" x="1340" y="110" width="160" height="64" rx="7"/><text x="1420.0" y="148.0" text-anchor="middle">Comprovante</text></g><g class="flow-node" data-node="expira" data-route="pix"><rect class="node-shape" x="1120" y="20" width="160" height="64" rx="7"/><text x="1200.0" y="47.0" text-anchor="middle">Aviso de</text><text x="1200.0" y="69.0" text-anchor="middle">QR Code expirado</text></g><g class="flow-node" data-node="estorno" data-route="pix"><rect class="node-shape" x="1120" y="240" width="160" height="64" rx="7"/><text x="1200.0" y="278.0" text-anchor="middle">Realizar estorno</text></g><g class="flow-node" data-node="conta" data-route="saldo local"><path class="node-shape decision" d="M640.0 355 705 420.0 640.0 485 575 420.0Z"/><text x="640.0" y="415.0" text-anchor="middle">Tem conta</text><text x="640.0" y="437.0" text-anchor="middle">digital?</text></g><g class="flow-node" data-node="pin" data-route="saldo"><rect class="node-shape" x="760" y="388" width="150" height="64" rx="7"/><text x="835.0" y="426.0" text-anchor="middle">Digitar PIN</text></g><g class="flow-node" data-node="debito" data-route="saldo"><rect class="node-shape" x="955" y="378" width="150" height="84" rx="7"/><text x="1030.0" y="404.0" text-anchor="middle">Transferir saldo</text><text x="1030.0" y="426.0" text-anchor="middle">do cliente para</text><text x="1030.0" y="448.0" text-anchor="middle">a tesouraria</text></g><g class="flow-node" data-node="comprasaldo" data-route="saldo"><rect class="node-shape" x="1160" y="388" width="160" height="64" rx="7"/><text x="1240.0" y="426.0" text-anchor="middle">Comprar dados</text></g><g class="flow-node" data-node="recibosaldo" data-route="saldo"><rect class="node-shape" x="1380" y="388" width="160" height="64" rx="7"/><text x="1460.0" y="426.0" text-anchor="middle">Comprovante</text></g><g class="flow-node" data-node="devolve" data-route="saldo"><rect class="node-shape" x="1160" y="535" width="160" height="84" rx="7"/><text x="1240.0" y="561.0" text-anchor="middle">Devolver saldo</text><text x="1240.0" y="583.0" text-anchor="middle">da tesouraria</text><text x="1240.0" y="605.0" text-anchor="middle">para o cliente</text></g><g class="flow-node" data-node="aviso" data-route="local"><rect class="node-shape" x="760" y="625" width="150" height="64" rx="7"/><text x="835.0" y="652.0" text-anchor="middle">Aviso sobre</text><text x="835.0" y="674.0" text-anchor="middle">recarga</text></g><g class="flow-node" data-node="mapa" data-route="local"><rect class="node-shape" x="955" y="625" width="150" height="64" rx="7"/><text x="1030.0" y="652.0" text-anchor="middle">Mapa de pontos</text><text x="1030.0" y="674.0" text-anchor="middle">de recarga</text></g></svg>